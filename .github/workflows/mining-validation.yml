name: Mining validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [mining-persistent-voxel-terrain]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/mining.test.ts --maxWorkers=1 --minWorkers=1
      - run: npm run build:server
